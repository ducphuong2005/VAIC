spring:
  application:
    name: career-compass-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:career_compass}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5500,http://localhost:8000,http://127.0.0.1:8000}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-bytes-long}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
    internal:
      crawler-api-key: ${INTERNAL_CRAWLER_API_KEY:dev-crawler-api-key-change-me}
  recommendation:
    weights:
      interest: ${REC_WEIGHT_INTEREST:0.25}
      ability: ${REC_WEIGHT_ABILITY:0.25}
      skill: ${REC_WEIGHT_SKILL:0.15}
      work-style: ${REC_WEIGHT_WORK_STYLE:0.10}
      market: ${REC_WEIGHT_MARKET:0.15}
      feasibility: ${REC_WEIGHT_FEASIBILITY:0.10}

llm:
  provider: ${LLM_PROVIDER:mock}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

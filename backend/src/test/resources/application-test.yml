spring:
  datasource:
    url: jdbc:h2:mem:career_compass;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  security:
    jwt:
      secret: test-secret-for-jwt-authentication-minimum-32-bytes
      access-token-minutes: 30
      refresh-token-days: 14
    internal:
      crawler-api-key: test-crawler-api-key

llm:
  provider: mock
  base-url: https://api.openai.com/v1
  api-key:
  model: gpt-4o-mini
  context-model: gpt-4o-mini
  answer-model: gpt-4o-mini
  timeout-seconds: 30
